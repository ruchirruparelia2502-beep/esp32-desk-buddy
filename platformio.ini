; PlatformIO Project Configuration File
; ESP32-2432S024C (CYD 2.4" Capacitive) Desk Buddy

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Flash partition to allow larger firmware
board_build.partitions = min_spiffs.csv

; Serial monitor speed
monitor_speed = 115200

; Upload speed
upload_speed = 921600

; CPU frequency
board_build.f_cpu = 240000000L

; Flash size
board_build.flash_size = 4MB

; Arduino core flags for Bluetooth
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCONFIG_BT_ENABLED=1
  -DCONFIG_BLUEDROID_ENABLED=1
  -DCONFIG_BT_A2DP_ENABLE=1
  -DCONFIG_BT_SPP_ENABLED=0
  -DCONFIG_NIMBLE_ENABLED=1
  -DUSE_NIMBLE

lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  TAMC/TAMC_CST820@^1.0.2
  bblanchon/ArduinoJson@^7.1.0
  arduino-libraries/NTPClient@^3.2.1
  h2zero/NimBLE-Arduino@^1.4.2
  pschatzmann/ESP32-A2DP@^1.8.6

; Extra library dependencies dirs (if needed)
lib_ldf_mode = deep+
lib_ignore =
  BluetoothSerial

; Partition table for 4MB flash with min SPIFFS (more space for firmware)
; min_spiffs.csv is a built-in PlatformIO partition table
